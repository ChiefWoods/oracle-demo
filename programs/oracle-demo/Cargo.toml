[package]
name = "oracle-demo"
version = "0.1.0"
description = "Created with Anchor"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "oracle_demo"

[features]
default = ["devnet"]
devnet = []
# For development only: accept oracle values regardless of their publication time.
disable-staleness-check = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"
borsh = "1.5.7"
chainlink-data-streams-report = "1.3.0"
chainlink_solana = "2.0.8"
chainlink_solana_data_streams = { git = "https://github.com/smartcontractkit/chainlink-data-streams-solana", rev = "893d2340254935fb947c95b6aa8e9e245c65ddc4" }
cfg-if = "1.0.0"
pyth-lazer-protocol = "0.46.0"
pyth-solana-receiver-sdk = "2.0.0"
switchboard-on-demand = { version = "0.13.0", default-features = false, features = ["solana-v3"] }

[dev-dependencies]
anchor-client = "1.2.0"
base64 = "0.22.1"
dotenvy = "0.15.7"
hex = "0.4.3"
hmac = "0.12.1"
pyth-lazer-solana-contract = { version = "0.8.0", features = ["no-entrypoint"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls-webpki-roots"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
solana-instruction = "3.0.0"
solana-keypair = "3.0.1"
solana-pubkey = "3.0.0"
solana-rpc-client = "3.0.14"
solana-sdk-ids = "3.0.0"
solana-signer = "3.0.0"
solana-transaction = { version = "3.0.1", features = ["bincode"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[package]
name = "oracle-demo"
version = "0.1.0"
description = "Created with Anchor"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "oracle_demo"

[features]
default = []
devnet = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"
borsh = "1.5.7"
chainlink-data-streams-report = "1.3.0"
chainlink_solana = "2.0.8"
chainlink_solana_data_streams = { git = "https://github.com/smartcontractkit/chainlink-data-streams-solana", rev = "893d2340254935fb947c95b6aa8e9e245c65ddc4" }
pyth-lazer-protocol = "0.46.0"
pyth-solana-receiver-sdk = "2.0.0"
switchboard-on-demand = { version = "0.13.0", default-features = false, features = ["solana-v2"] }

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
